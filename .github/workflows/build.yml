name: Build Nexus Injector

on:
  push:
    branches: [ "main", "fix/**" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Guard against accidental WebKit assets
        run: |
          if [ -d app/src/main/assets/webkit ]; then
            echo "Removing leftover app/src/main/assets/webkit (hosting removed)"
            rm -rf app/src/main/assets/webkit
          fi
          if [ -d app/src/main/assets/certs ]; then
            rm -rf app/src/main/assets/certs
          fi
          ls -la app/src/main/assets/

      - name: Build with Gradle
        run: gradle assembleDebug

      - name: Report APK size
        run: |
          ls -lah app/build/outputs/apk/debug/*.apk
          SIZE=$(stat -c%s app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK bytes: $SIZE"
          if [ "$SIZE" -gt 500000 ]; then
            echo "WARNING: APK is larger than 500KB — unexpected assets may be bundled"
            unzip -l app/build/outputs/apk/debug/*.apk | head -40
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Payload-Injector-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: Build Nexus Injector

on:
  push:
    branches: [ "main", "fix/**" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Auto-Unzip Uploaded Archives
        run: |
          set -euo pipefail
          find . -name "*.zip" -type f -not -path "./.git/*" -exec sh -c '
            dir="${1%.*}"
            echo "Extracting: $1 to $dir"
            mkdir -p "$dir"
            unzip -o -d "$dir" "$1"
            rm -f "$1"
          ' _ {} \; || true

      - name: Ensure WebKit host pages in assets
        run: |
          set -euo pipefail
          WEBKIT_DIR="app/src/main/assets/webkit"
          mkdir -p "$WEBKIT_DIR" tools
          if [ -f "$WEBKIT_DIR/index.html" ] && [ -f "$WEBKIT_DIR/poops.html" ]; then
            echo "Bundled WebKit pages already present."
            ls -la "$WEBKIT_DIR"
            exit 0
          fi
          echo "WebKit HTML missing — extracting from official host release..."
          curl -sL -o /tmp/wkhost.py \
            "https://github.com/itsPLK/ps5-webkit-autoloader/releases/download/v0.6.1/webkit-autoloader-host_v0.6.1.py"
          if [ ! -f tools/extract_webkit_host.py ]; then
            printf '%s\n' \
              'import base64, re, zipfile, io, sys' \
              'from pathlib import Path' \
              'host_py = Path(sys.argv[1])' \
              'out = Path(sys.argv[2])' \
              'out.mkdir(parents=True, exist_ok=True)' \
              'text = host_py.read_text(errors="replace")' \
              'm = re.search(r"EMBEDDED_ZIP_B64\s*=\s*\(([\s\S]*?)\)\s*\n", text)' \
              'if not m:' \
              '    raise SystemExit("EMBEDDED_ZIP_B64 not found")' \
              'parts = re.findall(r"\"([A-Za-z0-9+/=]+)\"", m.group(1))' \
              'z = zipfile.ZipFile(io.BytesIO(base64.b64decode("".join(parts))))' \
              'for name in z.namelist():' \
              '    if name.endswith("/"):' \
              '        continue' \
              '    target = out / Path(name).name' \
              '    target.write_bytes(z.read(name))' \
              '    print("wrote", target, target.stat().st_size)' \
              'idx = out / "index.html"' \
              'if idx.exists():' \
              '    (out / "relapse.html").write_bytes(idx.read_bytes())' \
              '    print("wrote", out / "relapse.html", "(alias)")' \
              > tools/extract_webkit_host.py
          fi
          python3 tools/extract_webkit_host.py /tmp/wkhost.py "$WEBKIT_DIR"
          ls -la "$WEBKIT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Payload-Injector-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

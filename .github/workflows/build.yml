name: Build Nexus Injector

on:
  push:
    branches: [ "main", "fix/**" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # No submodules — app does not require itsPLK as a git submodule
          submodules: false
          token: ${{ secrets.ACTIONS_PAT }}

      - name: Auto-Unzip Uploaded Archives
        run: |
          set -euo pipefail
          echo "Scanning repository for .zip files..."
          find . -name "*.zip" -type f -not -path "./.git/*" -exec sh -c '
            dir="${1%.*}"
            echo "Extracting: $1 to $dir"
            mkdir -p "$dir"
            unzip -o -d "$dir" "$1"
            rm -f "$1"
          ' _ {} \;
          echo "Extraction complete."

      - name: Ensure WebKit host pages in assets (no submodule)
        run: |
          set -euo pipefail
          WEBKIT_DIR="app/src/main/assets/webkit"
          mkdir -p "$WEBKIT_DIR"
          if [ -f "$WEBKIT_DIR/index.html" ] && [ -f "$WEBKIT_DIR/poops.html" ]; then
            echo "Bundled WebKit pages already present."
            ls -la "$WEBKIT_DIR"
            exit 0
          fi
          echo "WebKit HTML missing — extracting from official itsPLK host release (not a git submodule)..."
          curl -sL -o /tmp/wkhost.py \
            "https://github.com/itsPLK/ps5-webkit-autoloader/releases/download/v0.6.1/webkit-autoloader-host_v0.6.1.py"
          python3 tools/extract_webkit_host.py /tmp/wkhost.py "$WEBKIT_DIR"
          ls -la "$WEBKIT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Payload-Injector-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

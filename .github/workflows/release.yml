name: Release

on:
  push:
    tags:
      - 'v*'
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 34 + build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK to tag
        id: apk
        run: |
          TAG="${GITHUB_REF_NAME}"
          # strip leading v for nicer names if you want both — keep full tag as filename
          SRC=$(find app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then
            echo "No APK found"
            exit 1
          fi
          # Nexus-<tag>.apk  e.g. Nexus-v1.0.40.apk or Nexus-1.0.40.apk
          OUT="Nexus-${TAG}.apk"
          cp -f "$SRC" "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

# Tag only. Does not compile. Pulls the APK from the latest successful Build
# artifact for this commit (or the newest Build on the default branch).
on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for metadata only)
        uses: actions/checkout@v4

      - name: Download APK from Build workflow
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: Nexus-Payload-Injector-APK
          # Prefer artifact from the same commit as the tag
          commit: ${{ github.sha }}
          # If this commit never built, fall back to the newest successful Build run
          search_artifacts: true
          workflow_conclusion: success
          path: artifact
          if_no_artifact_found: warn

      - name: Fallback — latest successful Build artifact
        if: ${{ hashFiles('artifact/**/*.apk') == '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: Nexus-Payload-Injector-APK
          search_artifacts: true
          workflow_conclusion: success
          path: artifact
          if_no_artifact_found: fail

      - name: Rename APK to tag name
        id: apk
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SRC=$(find artifact -type f -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then
            echo "No APK artifact found. Run the Build workflow first, then tag."
            exit 1
          fi
          OUT="Nexus-${TAG}.apk"
          cp -f "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
